<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#594AE2" />
    <title>LiveAuction</title>
    <base href="/" />

    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="LiveAuction.Client.styles.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <script type="importmap"></script>

    <style>
        body, .mud-typography, .mud-button-label {
            font-family: 'Cairo', 'Roboto', sans-serif !important;
        }

        /* ===== Auction loading splash ===== */
        .la-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            overflow: hidden;
            font-family: 'Cairo', 'Roboto', sans-serif;
            background: radial-gradient(circle at 50% 32%, #efecff 0%, #ffffff 46%, #faf9ff 100%);
        }

        .la-splash::before,
        .la-splash::after {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .35;
            pointer-events: none;
        }

        .la-splash::before {
            top: -120px;
            left: -80px;
            background: #cfc7ff;
            animation: la-drift 9s ease-in-out infinite;
        }

        .la-splash::after {
            bottom: -140px;
            right: -90px;
            background: #b9e6ff;
            animation: la-drift 11s ease-in-out infinite reverse;
        }

        .la-badge {
            position: relative;
            display: grid;
            place-items: center;
            width: 124px;
            height: 124px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .92);
            box-shadow: 0 18px 45px rgba(89, 74, 226, .18), inset 0 0 0 1px rgba(89, 74, 226, .08);
        }

        .la-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(89, 74, 226, .28);
            animation: la-pulse 2.2s ease-out infinite;
        }

        .la-ring:nth-child(2) {
            animation-delay: 1.1s;
        }

        .la-gavel {
            display: inline-block;
            font-size: 56px;
            line-height: 1;
            transform-origin: 78% 82%;
            filter: drop-shadow(0 6px 10px rgba(89, 74, 226, .25));
            animation: la-swing 1.15s cubic-bezier(.45, .05, .55, .95) infinite;
        }

        .la-impact {
            position: absolute;
            bottom: 4px;
            left: 50%;
            width: 54px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid rgba(89, 74, 226, .4);
            opacity: 0;
            transform: translateX(-50%) scale(.4);
            animation: la-impact 1.15s ease-out infinite;
        }

        .la-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: .5px;
            background: linear-gradient(90deg, #594AE2 0%, #9a8cff 45%, #594AE2 90%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: la-shimmer 2.6s linear infinite;
        }

        .la-subtitle {
            display: flex;
            align-items: center;
            gap: 3px;
            color: #6b6880;
            font-size: 15px;
        }

        .la-dots span {
            display: inline-block;
            animation: la-bounce 1.2s infinite;
        }

        .la-dots span:nth-child(2) {
            animation-delay: .15s;
        }

        .la-dots span:nth-child(3) {
            animation-delay: .3s;
        }

        .la-progress {
            position: relative;
            width: 220px;
            height: 6px;
            border-radius: 999px;
            background: #e9e6fb;
            overflow: hidden;
        }

        .la-progress span {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 45%;
            border-radius: inherit;
            background: linear-gradient(90deg, #8b7cf6, #594AE2);
            animation: la-progress 1.35s ease-in-out infinite;
        }

        @keyframes la-swing {
            0%, 100% { transform: rotate(-22deg); }
            38% { transform: rotate(14deg); }
            48% { transform: rotate(14deg); }
            64% { transform: rotate(-22deg); }
        }

        @keyframes la-pulse {
            0% { transform: scale(.82); opacity: .75; }
            70%, 100% { transform: scale(1.55); opacity: 0; }
        }

        @keyframes la-impact {
            0%, 38% { opacity: 0; transform: translateX(-50%) scale(.4); }
            46% { opacity: .8; transform: translateX(-50%) scale(1); }
            70%, 100% { opacity: 0; transform: translateX(-50%) scale(1.8); }
        }

        @keyframes la-shimmer {
            to { background-position: 200% center; }
        }

        @keyframes la-bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: .35; }
            40% { transform: translateY(-4px); opacity: 1; }
        }

        @keyframes la-progress {
            0% { left: -50%; }
            100% { left: 110%; }
        }

        @keyframes la-drift {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(20px, 25px, 0) scale(1.08); }
        }

        @media (prefers-reduced-motion: reduce) {
            .la-splash::before,
            .la-splash::after,
            .la-ring,
            .la-gavel,
            .la-impact,
            .la-title,
            .la-progress span,
            .la-dots span {
                animation: none !important;
            }

            .la-gavel {
                transform: rotate(0deg);
            }

            .la-progress span {
                left: 27%;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="la-splash" role="status" aria-live="polite" aria-label="جاري تحميل التطبيق">
            <div class="la-badge" aria-hidden="true">
                <span class="la-ring"></span>
                <span class="la-ring"></span>
                <span class="la-gavel">🔨</span>
                <span class="la-impact"></span>
            </div>

            <div class="la-title" aria-hidden="true">Live Auction</div>

            <div class="la-subtitle">
                <span>جاري التحميل</span>
                <span class="la-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
            </div>

            <div class="la-progress" aria-hidden="true"><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        حدث خطأ غير متوقع.
        <a href="." class="reload">إعادة تحميل</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
